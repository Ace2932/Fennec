# nova_geometry.yaml — CAD-side reference copy of the leg kinematic constants.
#
# Consumed by: ros2_ws/src/nova_locomotion/test/test_urdf_sync.py, which loads
# this file and asserts leg.hip_offset/femur/tibia equal both
# nova_locomotion/.../kinematics/leg_ik.py (LegParams defaults) and
# nova_description/urdf/nova.urdf.xacro. Edit here AND there; the test fails
# loudly on drift.
#
# STATUS: measured 2026-07-01 (femur/tibia, STL bores/foot-post) and
# 2026-07-02 (hip_offset, A360 assembly) — see leg_ik.py's own comments for
# the per-joint breakdown. Blocker B2 (exact axis-to-axis vs bbox estimate)
# is CLOSED.

units: metres   # URDF/IK use metres; CAD STLs are mm (÷1000)

# --- measured part bounding boxes (stl_measure.py, leg_v5/*_L.stl, 2026-06-16) ---
# Reference only, predates the v6/B2 measurement — bbox >= true axis-to-axis
# link length, kept for provenance.
measured_bbox_mm:
  coax_L:        [37.59, 46.13, 57.50]   # hip-roll (HAA) hub
  femur_shell_L: [138.54, 51.09, 34.66]  # hip-pitch (HFE) link, knee servo inside
  tibia_L:       [129.35, 100.09, 38.48] # knee (KFE) link, L-shaped, passive

# --- leg kinematic parameters (the canonical numbers, test-enforced) ---
leg:
  hip_offset:  0.0643  # HAA axis -> HFE axis, lateral (+y). MEASURED 2026-07-02.
  femur:       0.1069  # HFE axis -> KFE axis.  MEASURED 2026-07-01 (STL bores).
  tibia:       0.1290  # KFE axis -> foot.      MEASURED 2026-07-01 (STL foot-post ctr).
  # #443: the ONE foot contact radius. MEASURED 2026-09-25 from the SM3_Foot shoe
  # mesh at its toe_v2 mount pose (check_shoe.shoe_pose): reach beyond the foot
  # point along the tibia axis = 17.0 mm (sagittal max 18.5 at the crescent tips).
  # Test-enforced equal to the URDF collision sphere, the MJCF foot geom and
  # sim env.FOOT_RADIUS (test_urdf_sync.test_foot_radius_one_value).
  foot_radius: 0.017
  # #72: haa_range/hfe_range/kfe_range placeholders (0.7 symmetric / 1.5 / 2.2)
  # used to live here, untested (test_urdf_sync.py only ever checked
  # hip_offset/femur/tibia) and stale against the real, asymmetric ROM
  # (nova.urdf.xacro haa_in=0.262/haa_out=0.698, kfe_range=1.9). Deleted
  # rather than fixed: grepping the repo for haa_range/hfe_range/kfe_range
  # shows nothing reads them FROM THIS FILE — the real joint-limit source of
  # truth is nova_locomotion's LegParams (leg_ik.py) and the URDF, both
  # already covered by test_urdf_sync.py's other asserts. A dead, unchecked
  # copy is worse than no copy.

# --- servo / actuator (verified, dimensions.md §1) ---
servo:
  model: Feetech_STS3215
  body_mm:        [45.40, 24.80, 34.30]
  spline_x_offset_mm: 12.50   # spline axis offset from body center along long axis
