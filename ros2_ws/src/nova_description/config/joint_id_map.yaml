# Canonical Feetech bus-ID <-> URDF joint-name map for NovaSM3.
# Single source of truth tying the firmware/ROS2 joint_ids (1-12) to the URDF
# joint names. The /joint_states bridge + gait controller consume this.
#
# CONVENTION (decided 2026-06-27): PER-LEG SEQUENTIAL. Walk the daisy chain leg
# by leg; within each leg the 3 joints in mechanical order haa -> hfe -> kfe:
#   leg1 FL = IDs 1-3, leg2 FR = 4-6, leg3 RL = 7-9, leg4 RR = 10-12.
# Matches the physical chain order => least error-prone ID assignment.
# Joint NAMES use the URDF convention haa/hfe/kfe (nova.urdf.xacro):
#   haa = hip abduction (coxa), hfe = hip flexion (femur/thigh), kfe = knee (tibia).
#
# ⚠️ POWER NOTE: hips (haa) are now IDs 1,4,7,10 — NOT a contiguous 1-4 block.
# The dual-voltage harness powers each servo by PHYSICAL position (12V to each
# haa, 7.5V to each hfe/kfe), independent of ID. The old "IDs 1-4 = hips on 12V"
# shorthand in wiring/setup-servos docs is SUPERSEDED by this map.
#
# IDs 13-18 reserved for the Phase-4 arm (not in this quadruped URDF).

joint_id_map:
  FL_haa: 1
  FL_hfe: 2
  FL_kfe: 3
  FR_haa: 4
  FR_hfe: 5
  FR_kfe: 6
  RL_haa: 7
  RL_hfe: 8
  RL_kfe: 9
  RR_haa: 10
  RR_hfe: 11
  RR_kfe: 12
