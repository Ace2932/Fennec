# Canonical Feetech bus-ID <-> URDF joint-name map for NovaSM3.
# The firmware/ROS2 stack is ID-based (joint_ids 1-12); this file is the single
# source of truth tying those IDs to the URDF joint names. The /joint_states
# bridge + gait controller should consume this.
#
# Physical labeling convention (docs/setup-servos.md): IDs 1-4 = hips,
# 5-12 = femur/tibia. The per-leg assignment below is the PROPOSED canonical
# map — verify against the physical servo labels during ID assignment.
#
# IDs 13-18 reserved for the Phase-4 arm (not in this quadruped URDF).

joint_id_map:
  # hip ab/ad (HAA) — coax servos, 12V rail, IDs 1-4
  FL_haa: 1
  FR_haa: 2
  RL_haa: 3
  RR_haa: 4
  # hip flex (HFE) + knee (KFE) — femur/tibia servos, 7.5V rail, IDs 5-12
  FL_hfe: 5
  FL_kfe: 6
  FR_hfe: 7
  FR_kfe: 8
  RL_hfe: 9
  RL_kfe: 10
  RR_hfe: 11
  RR_kfe: 12
