# LE_NOVA Workflow Hardware Pcb Modification And Firmware Update

## Action

Follow the hardware-pcb-modification-and-firmware-update workflow:
1. Edit KiCad schematic (.kicad_sch) to add or modify hardware connections.
2. Update PCB layout (.kicad_pcb) to match schematic changes.
3. Re-generate and export new gerber files for manufacturing.
4. Update documentation (e.g., master-bom.md, pre-power-on-validation.md) to reflect hardware changes.
5. Modify firmware source files (e.g., .h/.cpp) to align with new hardware pin mappings or features.
6. Verify design rule checks (DRC/ERC) and update documentation as needed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: hardware/pcb-mods/nova_pcb_v6_logic/*.kicad_sch, hardware/pcb-mods/nova_pcb_v6_logic/*.kicad_pcb, hardware/pcb-mods/nova_pcb_v6_logic/*gerbers.zip

