name: firmware-compile

# Compile checks for the Teensy 4.1 firmware, on every PR + push to main.
#
# TWO build jobs on purpose, because one of them is not enough:
#
#   arduino-only-build  -e teensy41_ci   ~3 min, NOVA_USE_MICRO_ROS undefined.
#                       Fast pre-merge filter. Exercises the device-side code
#                       (feetech protocol/bus, INA226, ISR tick).
#   microros-build      -e teensy41      the env that actually flashes. Needed
#                       because 488 of main.cpp's 1249 lines (39%) are inside
#                       `#ifdef NOVA_USE_MICRO_ROS` and the fast job therefore
#                       never compiles them (#190).
#
# The old comment here said the Arduino-only build "exercises all device-side
# code ... which is fine for catching real regressions". True as far as it goes,
# and it left 39% of the shipping firmware compiled by nothing in CI — the
# Jetson build before flashing was the only thing covering it, by hand, at the
# worst possible moment to discover a typo.
#
# The Jetson build is still the real integration step. It is no longer the FIRST
# time the micro-ROS half gets compiled.

on:
  pull_request:
    paths:
      - 'firmware/teensy/firmware/**'
      - '.github/workflows/firmware-compile.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/teensy/firmware/**'
      - '.github/workflows/firmware-compile.yml'

jobs:
  arduino-only-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build (Arduino-only CI env)
        working-directory: firmware/teensy/firmware
        run: pio run -e teensy41_ci

      - name: Report size
        working-directory: firmware/teensy/firmware
        if: success()
        run: pio run -e teensy41_ci --target size

  microros-build:
    # THE OTHER 39%. `teensy41_ci` leaves NOVA_USE_MICRO_ROS undefined, and 488
    # of main.cpp's 1249 lines sit inside `#ifdef NOVA_USE_MICRO_ROS` — so the
    # fast job above compiles 61% of the firmware that actually ships. A typo or
    # header break in the micro-ROS half passed every check and only surfaced at
    # the Jetson, by hand, when you were already trying to flash.
    #
    # Runs in the ros:humble container because micro_ros_platformio wants
    # Python 3.10 + ROS dev libs, which is the reason it was excluded rather
    # than an argument that it should stay excluded.
    #
    # If this proves slow or flaky, move it to `schedule` + `workflow_dispatch`
    # rather than deleting it — a slow check on main beats no check at all.
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-pip git
          pip3 install --upgrade platformio

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-uros-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-uros-${{ runner.os }}-

      - name: Build (full micro-ROS env — the one that flashes)
        working-directory: firmware/teensy/firmware
        run: pio run -e teensy41

      - name: Report size
        working-directory: firmware/teensy/firmware
        if: success()
        run: pio run -e teensy41 --target size

  native-unit-tests:
    # Host-run unit suites for the pure-logic modules (feetech wire protocol +
    # safety FSM). No Teensy toolchain, no hardware — runs in seconds and
    # catches logic regressions (checksum, frame sizing, sign-magnitude packing,
    # E-stop latch, battery debounce) that the compile-only job can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        working-directory: firmware/teensy/firmware
        run: pio test -e native
