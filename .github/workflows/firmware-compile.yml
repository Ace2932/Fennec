name: firmware-compile

# Compile checks for the Teensy 4.1 firmware, on every PR + push to main.
#
# TWO build jobs on purpose, because one of them is not enough:
#
#   arduino-only-build  -e teensy41_ci   ~3 min, NOVA_USE_MICRO_ROS undefined.
#                       Fast pre-merge filter. Exercises the device-side code
#                       (feetech protocol/bus, INA226, ISR tick).
#   microros-build      -e teensy41      the env that actually flashes. Needed
#                       because 488 of main.cpp's 1249 lines (39%) are inside
#                       `#ifdef NOVA_USE_MICRO_ROS` and the fast job therefore
#                       never compiles them (#190).
#
# The old comment here said the Arduino-only build "exercises all device-side
# code ... which is fine for catching real regressions". True as far as it goes,
# and it left 39% of the shipping firmware compiled by nothing in CI — the
# Jetson build before flashing was the only thing covering it, by hand, at the
# worst possible moment to discover a typo.
#
# The Jetson build is still the real integration step. It is no longer the FIRST
# time the micro-ROS half gets compiled.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/teensy/firmware/**'
      - '.github/workflows/firmware-compile.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/teensy/firmware/**'
      - '.github/workflows/firmware-compile.yml'

jobs:
  arduino-only-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build (Arduino-only CI env)
        working-directory: firmware/teensy/firmware
        run: pio run -e teensy41_ci

      - name: Report size
        working-directory: firmware/teensy/firmware
        if: success()
        run: pio run -e teensy41_ci --target size

  microros-build:
    # THE OTHER 39%. `teensy41_ci` leaves NOVA_USE_MICRO_ROS undefined, and 488
    # of main.cpp's 1249 lines sit inside `#ifdef NOVA_USE_MICRO_ROS` — so the
    # fast job above compiles 61% of the firmware that actually ships. A typo or
    # header break in the micro-ROS half passed every check and only surfaced at
    # the Jetson, by hand, when you were already trying to flash.
    #
    # Runs in the ros:humble container because micro_ros_platformio wants
    # Python 3.10 + ROS dev libs, which is the reason it was excluded rather
    # than an argument that it should stay excluded.
    #
    # ✅ FIXED 2026-08-01 (#190) and re-enabled on pull_request/push. This job was
    # quarantined behind `workflow_dispatch` because it genuinely failed — and it
    # was right to. What it found:
    #
    #   rcutils/src/time_unix.c:76: error: implicit declaration of function
    #   'clock_gettime'   ->  Failed <<< rcutils
    #
    # ROOT CAUSE: `platform = teensy` was UNPINNED, so CI resolved
    # toolchain-gccarmnoneeabi-teensy@1.150201.0 (GCC 15.2), where an implicit
    # function declaration is an ERROR rather than a warning. micro_ros_platformio
    # ships the clock_gettime DEFINITION (platform_code/arduino/clock_gettime.cpp)
    # but rcutils compiles without a declaration in scope. The Jetson kept building
    # only on a stale cached toolchain — the firmware was reproducible by accident,
    # and CI simply reached the cliff first.
    #
    # THE FIX: `platform = teensy@5.0.0`, pinned in [teensy_base] so teensy41_ci
    # validates the same compiler that ships. Pinning the TOOLCHAIN alone was tried
    # and is wrong — it fixes the compile, then fails at link on
    # `--no-warn-rwx-segments` (a mismatched new-platform/old-toolchain pair) and
    # breaks teensy41_ci too. Full reasoning in platformio.ini [teensy_base].
    #
    # Proof it compiles the real ROS layer rather than a stub: micro-ros-build
    # produces ~112,216 B FLASH against the Arduino-only build's ~21,220 — 5.3x.
    #
    # Do NOT "fix" a future recurrence with -Wno-error=implicit-function-declaration:
    # that hides a real missing declaration in code that runs the servo bus.
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      # NOT `pip install platformio`. micro_ros_platformio's build_dev_env
      # sources PlatformIO's OWN virtualenv to run colcon:
      #   . $PLATFORMIO_CORE_DIR/penv/bin/activate
      # A system-pip install never creates that penv, so the dev-dependency
      # build dies with "cannot open .../penv/bin/activate: No such file" after
      # downloading ament/googletest. The official installer does create it.
      - name: Install PlatformIO via the official installer (creates penv)
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-venv python3-pip git curl cmake build-essential \
            python3-colcon-common-extensions
          curl -fsSL https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py -o /tmp/get-platformio.py
          python3 /tmp/get-platformio.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-uros-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-uros-${{ runner.os }}-

      - name: Build (full micro-ROS env — the one that flashes)
        working-directory: firmware/teensy/firmware
        run: pio run -e teensy41

      - name: Report size
        working-directory: firmware/teensy/firmware
        if: success()
        run: pio run -e teensy41 --target size

  native-unit-tests:
    # Host-run unit suites for the pure-logic modules (feetech wire protocol +
    # safety FSM). No Teensy toolchain, no hardware — runs in seconds and
    # catches logic regressions (checksum, frame sizing, sign-magnitude packing,
    # E-stop latch, battery debounce) that the compile-only job can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/teensy/firmware/platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        working-directory: firmware/teensy/firmware
        run: pio test -e native
