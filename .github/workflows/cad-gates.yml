name: cad-gates

# The CAD fit gates, on every PR that touches CAD.
#
# WHY (#166): these gates are the only automated check on this project's
# dominant failure mode — geometry where each part is individually correct and
# the SEAM between them is wrong. #163 (rear hip placed as a translation
# instead of a 180-degree yaw) and #165 (URDF carrying the stock hip grid) both
# shipped, and both were caught by a human reading files, because the gates
# could only run on one laptop: they read their reference meshes from the ROOT
# repo via absolute /Users paths. Those inputs are vendored now
# (hardware/cad/cad_assets.py), so the gates run anywhere.
#
# These run against the COMMITTED STLs, not freshly rendered ones — no OpenSCAD
# here. That is deliberate: the committed STL is what gets printed, so it is the
# thing worth gating. The residual gap is a .scad edited without re-rendering;
# closing that needs an OpenSCAD render-and-compare job and is tracked
# separately.

on:
  pull_request:
    paths:
      - 'hardware/cad/**'
      - '.github/workflows/cad-gates.yml'
      # The vendored stock meshes live in the ROS package but are INPUTS to two
      # gated producers: trunk_build.py and gen_viewer.py both reach them via
      # cad_assets.STOCK_MESHES. Edit SM3_Frame_ChassisTrunk.stl or SM3_Foot.stl
      # and trunk.stl / robot_viewer.html go stale — with the filter limited to
      # hardware/cad/** this workflow would not even run. Same shape as the
      # widening in ros-pytest.yml, and for the same reason.
      - 'ros2_ws/src/nova_description/meshes/**'
  push:
    branches: [main]
    paths:
      - 'hardware/cad/**'
      - '.github/workflows/cad-gates.yml'
      # The vendored stock meshes live in the ROS package but are INPUTS to two
      # gated producers: trunk_build.py and gen_viewer.py both reach them via
      # cad_assets.STOCK_MESHES. Edit SM3_Frame_ChassisTrunk.stl or SM3_Foot.stl
      # and trunk.stl / robot_viewer.html go stale — with the filter limited to
      # hardware/cad/** this workflow would not even run. Same shape as the
      # widening in ros-pytest.yml, and for the same reason.
      - 'ros2_ws/src/nova_description/meshes/**'

jobs:
  leg-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh deps
        # trimesh's proximity/boolean paths pull scipy + rtree + manifold3d;
        # installing them explicitly keeps a missing extra from silently
        # degrading a gate into a weaker check.
        # embreex = Intel Embree bindings. trimesh picks it up automatically and
        # falls back to a pure-numpy ray engine without it. That fallback has no
        # spatial acceleration: it tests every ray against every triangle, which
        # is what made the sweep an 18 GB job in #178. Measured with it:
        # 334.7 s -> 104.5 s (3.2x), 4.17 GB -> 3.16 GB, and VERDICTS IDENTICAL
        # line for line against the pure-numpy run.
        run: pip install -r hardware/cad/requirements.txt

      - name: Runner resources
        # Recorded on purpose: the sweep below does NOT run here because it
        # needs more memory than a hosted runner has, and that judgement should
        # be re-checkable rather than folklore.
        run: |
          free -m
          nproc

      - name: Assembly fit sweep (leg_v6)
        # The ROM/fit authority. Excluded until #178: it peaked at 18 GB RSS
        # and was OOM-killed on a 16 GB runner. Now 5.1 GB, because the two
        # calls responsible were batched — trimesh's pure-numpy ray engine and
        # its proximity queries both materialise per-(point x face) arrays for
        # the whole query at once. Sample counts are UNCHANGED; the gate checks
        # exactly what it checked before.
        working-directory: hardware/cad/leg_v6
        run: python -u check_fit.py --sweep

      - name: Shoe fit
        working-directory: hardware/cad/leg_v6
        run: python check_shoe.py

      - name: Mesh health (printable leg parts)
        # Watertight / single-body / positive-volume on every printable leg part.
        # This ran ONLY from build_all.sh, which no workflow invokes — so the
        # printability guard was never enforced in CI. It exits 1 on failure and
        # always could; nothing was calling it.
        working-directory: hardware/cad/leg_v6
        run: |
          python ../mesh_health.py *_R.stl *_L.stl knee_arm.stl knee_bumper.stl \
            shoulder.stl shoulder_plate.stl shoulder_plate_L.stl cable_clip.stl \
            strap.stl grommet_insert.stl coax_hfe_plate.stl coax_hfe_plate_L.stl

      - name: Servo orientation gate
        # Proves each servo seats only ONE way round — this is the evidence the
        # derived hfe/kfe signs in nova_ops/safety_envelope/derived_signs.py
        # rest on. Loosen an arm relief and the flipped servo starts fitting,
        # which removes that evidence silently.
        working-directory: hardware/cad/leg_v6
        run: python servo_orientation_gate.py

  chassis-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh deps
        # embreex = Intel Embree bindings. trimesh picks it up automatically and
        # falls back to a pure-numpy ray engine without it. That fallback has no
        # spatial acceleration: it tests every ray against every triangle, which
        # is what made the sweep an 18 GB job in #178. Measured with it:
        # 334.7 s -> 104.5 s (3.2x), 4.17 GB -> 3.16 GB, and VERDICTS IDENTICAL
        # line for line against the pure-numpy run.
        run: pip install -r hardware/cad/requirements.txt

      - name: Chassis fit gate
        # Leg-vs-chassis interference, fastener families, posture ROM envelope.
        working-directory: hardware/cad/chassis
        run: python check_fit.py

      - name: Mesh health (printable chassis parts)
        # Same guard as the leg job; also previously reachable only through
        # build_all.sh, which CI never runs.
        #
        # trunk.stl is deliberately NOT in this list. build_all.sh:53 runs it
        # with `|| echo "KNOWN EXCEPTION ..."` — a documented pre-existing sliver
        # cluster that fails the strict post-reload watertight check. Excluding
        # it here is honest; inheriting that `||` would mean a step that cannot
        # fail, which is the thing this whole pass is closing.
        working-directory: hardware/cad/chassis
        run: |
          python ../mesh_health.py head.stl head_ear.stl head_ear_L.stl \
            l2_adapter.stl control_pod.stl jetson_case_mount.stl \
            jetson_clamp_bar.stl oled_mount.stl neck_bracket.stl \
            case_slot_grommet.stl lead_notch_grommet.stl skid_rail.stl \
            riser_bay.stl spacer.stl battery_pocket.stl floor_plate.stl

  stl-freshness:
    # Does every committed STL match the .scad that claims to produce it? (#176)
    #
    # The other jobs check the COMMITTED STLs, which is right — that is what
    # gets printed. The hole is editing a .scad and not re-running build_all.sh:
    # the gates then certify the OLD geometry while the source says something
    # else, and nothing notices.
    #
    # CALIBRATED, not guessed. CI has OpenSCAD 2021.01 and the dev Mac has
    # 2026.04.26 — five years apart — and 30 of 33 parts still agree to within
    # 0.0006 mm, with volume and bbox effectively exact on every part. The gate
    # is the p99 of sampled surface distance, not the max, because two parts
    # deviated by ~1 mm on a handful of facets while volume and bbox were
    # identical to four decimals; p99 ignores those and still trips at 0.605 mm
    # on a real 1 mm edit. See check_stl_fresh.py for the full derivation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenSCAD + mesh deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
          pip install -r hardware/cad/requirements.txt

      - name: Every committed STL matches its .scad
        run: python -u hardware/cad/check_stl_fresh.py

  generated-freshness:
    # The same question for the artifacts check_stl_fresh CANNOT see: the ones
    # built by Python rather than OpenSCAD. trunk.stl is in that gate's SKIP set
    # by name; robot_viewer.html is not an STL and is in no build_all.sh.
    #
    # This is the hole that actually cost something. gen_viewer.py crashed on a
    # part retired 2026-07-10 (#41) and stayed broken 18 days, while the
    # committed robot_viewer.html kept opening fine and showing 2026-07-11
    # geometry — 25 chassis/leg STLs changed underneath it and nothing noticed.
    # A committed artifact proves its producer ran once, not that it still can.
    #
    # No OpenSCAD needed: both producers are pure Python.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mesh deps
        run: pip install -r hardware/cad/requirements.txt

      - name: Every committed python-built artifact matches its producer
        run: python -u hardware/cad/check_generated_fresh.py
