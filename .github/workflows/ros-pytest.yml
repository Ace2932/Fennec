name: ros-pytest

# Pure-logic unit tests for the ROS 2 packages, on every PR + push to main.
# These suites import only the packages' algorithm modules (no rclpy, no
# hardware), so they run fast on plain CPython without a ROS install — the same
# way they're authored. The full colcon build + node-level tests run on the
# Jetson; this is the quick pre-merge correctness filter.

on:
  pull_request:
    paths:
      - 'ros2_ws/src/**'
      - '.github/workflows/ros-pytest.yml'
      # test_urdf_sync reads the CAD and the generated MJCF directly — it is
      # the cross-seam check that CAD, URDF and sim agree on the same geometry
      # (#165). Filtering it to ros2_ws only would have meant the guard never
      # fired on the changes MOST likely to break it: a CAD edit, or a
      # regenerated nova.xml.
      - 'hardware/cad/**'
      - 'sim/nova_mjx/**'
  push:
    branches: [main]
    paths:
      - 'ros2_ws/src/**'
      - '.github/workflows/ros-pytest.yml'
      # test_urdf_sync reads the CAD and the generated MJCF directly — it is
      # the cross-seam check that CAD, URDF and sim agree on the same geometry
      # (#165). Filtering it to ros2_ws only would have meant the guard never
      # fired on the changes MOST likely to break it: a CAD edit, or a
      # regenerated nova.xml.
      - 'hardware/cad/**'
      - 'sim/nova_mjx/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        # pyyaml: nova_ops.joint_map loads the joint-ID map YAML
        # numpy:  nova_ops.lidar_selffilter mask
        # mujoco: NOT optional. test_derived_signs and test_cable_gate_envelope
        #   guard the CAD<->URDF<->MJCF seam with `pytest.importorskip("mujoco")`.
        #   Without the wheel those 11 tests SKIPPED here while passing locally,
        #   so this job went green having never checked the seam — even though
        #   the path filters above were deliberately widened to hardware/cad/**
        #   and sim/** so a CAD edit WOULD trigger it. The trigger fired, the
        #   guard skipped, the check reported success. test_derived_signs is the
        #   guard for the sign/frame bug class (#163's backwards rear hip).
        # trimesh+deps: test_derived_signs and test_cable_gate_envelope load
        #   hardware/cad/leg_v6/check_fit.py by path to cross-check the ROS-side
        #   envelope against the CAD gate's own numbers. Without trimesh that
        #   import raises and the tests skip — the guard on the ROS<->CAD seam,
        #   including the LA-20 cable envelope, silently not running.
        run: pip install pytest pyyaml numpy mujoco trimesh scipy networkx rtree

      - name: Run package unit tests
        run: |
          set -e
          cd ros2_ws/src
          SRC=$(pwd)   # so cross-package imports (e.g. nova_locomotion's
                       # test_controller -> nova_ops.joint_map) resolve
          fail=0
          # NOTHING IS IGNORED HERE ANY MORE. test_preflight.py used to be
          # skipped for importing rclpy transitively, and CLAUDE.md told you to
          # skip it locally for the same reason — so it ran nowhere, and when
          # #187 added FirmwareTablesCheck its hardcoded "expect 3 checks"
          # assertion started failing with no one to see it. The checks now defer
          # their ROS imports into run(), so the registry imports without a ROS
          # install and the suite runs here. If you find yourself adding an
          # --ignore back, you are re-creating that hole.
          for pkg in nova_ops nova_calibration nova_locomotion; do
            if [ -d "$pkg/test" ]; then
              echo "::group::$pkg"
              ( cd "$pkg" && PYTHONPATH="$SRC/nova_ops:$SRC/nova_calibration:$SRC/nova_locomotion:." python -m pytest test/ -q ) || fail=1
              echo "::endgroup::"
            fi
          done
          exit $fail
