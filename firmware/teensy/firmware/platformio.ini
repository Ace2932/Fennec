; PlatformIO project — Nova-SM3 LE Teensy 4.1 firmware
; Pattern B bus master per BOM v3.3:
;   Jetson micro-ROS over USB → Teensy → 74HC125 → Feetech STS3215 TTL bus
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; NOTE — 2026-05-19: builds moved to Jetson (Python 3.10 OK).
; Mac path remains Arduino-only (micro_ros_platformio breaks on Py3.14).
; To build on Mac, comment out NOVA_USE_MICRO_ROS flag + lib_deps below.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D NOVA_TEENSY_FIRMWARE
    -D NOVA_BUS_BAUD=1000000
    -D NOVA_LOOP_HZ=200
    -D NOVA_USE_MICRO_ROS
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
    robtillaart/INA226@^0.6.4
monitor_speed = 115200
upload_protocol = teensy-cli
