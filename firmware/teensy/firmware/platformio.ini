; PlatformIO project — Nova-SM3 LE Teensy 4.1 firmware
; Pattern B bus master per BOM v3.3:
;   Jetson micro-ROS over USB → Teensy → 74HC125 → Feetech STS3215 TTL bus
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
; Test:    pio test -e native   (host-run unit suites, no Teensy toolchain)
;
; NOTE — 2026-05-19: builds moved to Jetson (Python 3.10 OK).
; Mac path remains Arduino-only (micro_ros_platformio breaks on Py3.14).
; To build on Mac, comment out NOVA_USE_MICRO_ROS flag + lib_deps below.
;
; The shared Teensy config lives in [teensy_base] (NOT [env]) so the host-side
; [env:native] test env inherits none of the Teensy platform/board/framework
; keys — it would otherwise fail with "Unknown board ID 'teensy41'".

; Shared Teensy defaults: build flags + libs that don't need ROS dev tooling.
[teensy_base]
; ⚠ UNPINNED, and it is currently BROKEN for the micro-ROS env (#190).
; A clean resolve picks toolchain-gccarmnoneeabi-teensy@1.150201.0 (GCC 15.2),
; where `-Wimplicit-function-declaration` is an ERROR — and rcutils'
; time_unix.c calls clock_gettime with no declaration in scope, so
; `pio run -e teensy41` fails at "Failed <<< rcutils". The Jetson still builds
; only because it has an older toolchain cached, which means a fresh checkout
; there, or any platform update, stops the firmware from building at all.
; Pin this to the Jetson's proven version — `pio platform list` +
; `pio pkg list -e teensy41` there — then re-enable the microros-build triggers
; in .github/workflows/firmware-compile.yml. teensy41_ci (Arduino-only) is
; unaffected: it does not compile rcutils.
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D NOVA_TEENSY_FIRMWARE
    -D NOVA_BUS_BAUD=1000000
    -D NOVA_LOOP_HZ=200
    ; 4th INA226 on the L2 LiDAR 12V rail (0x45). Adds rail_l2 to the round-robin
    ; + publishes it at /power_rails[9..11] (12-float layout). LiDAR is nav-critical
    ; + brownout-sensitive, so it gets the 4th module (arm rail deferred — DNP).
    -D NOVA_INA226_L2
    ; Build provenance — git SHA captured at compile time, exposed via
    ; /firmware_version. Falls back to "unknown" outside a git checkout.
    !echo '-D NOVA_BUILD_GIT_SHA=\"'$(git rev-parse --short HEAD 2>/dev/null || echo unknown)'\"'
monitor_speed = 115200
upload_protocol = teensy-cli
lib_deps =
    robtillaart/INA226@^0.6.4

; Default env — used on the Jetson, includes micro-ROS.
[env:teensy41]
extends = teensy_base
; ROS DISTRO — MUST be stated. micro_ros_platformio defaults to KILTED:
;   extra_script.py:38
;   microros_distro = global_env.BoardConfig().get("microros_distro", "kilted")
; This env never set it, so the firmware was being built against kilted while
; the Jetson, the agent and every ROS package in this repo are HUMBLE. Upstream's
; own reference config (ci/platformio.ini) sets the distro explicitly on every
; test env, which is the convention being followed here.
; Symptom when it is wrong: the micro-ROS dev-dependency build dies with
;   Could not find a package configuration file provided by "rmw"
;   Failed <<< rmw_test_fixture
board_microros_distro = humble
board_microros_transport = serial
build_flags =
    ${teensy_base.build_flags}
    -D NOVA_USE_MICRO_ROS
lib_deps =
    ${teensy_base.lib_deps}
    ; PINNED 2026-07-30 (#190). Was tracking whatever HEAD happened to be that
    ; day, which meant the firmware that flashes to the robot was not
    ; reproducible — a silent upstream change would land on the next clean build
    ; with nothing in this repo recording it. cfee17f is the commit the previous
    ; note already identified as current since 2025-09-17, so pinning it changes
    ; nothing today and stops it changing under us tomorrow.
    ; To move deliberately: bump this ref, build -e teensy41, say so in the commit.
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17f

; CI env — Arduino-only, no micro-ROS lib pull. Used by .github/workflows so
; PR checks finish in ~3 min without the ROS dev-libs install. Exercises every
; non-micro-ROS code path (feetech protocol/bus, INA226, ISR tick, histograms).
[env:teensy41_ci]
extends = teensy_base
build_flags = ${teensy_base.build_flags}
lib_deps    = ${teensy_base.lib_deps}

; Native host-test env — runs the pure-logic unit suites (test/test_*) on the
; dev machine / CI with the host compiler, no Teensy toolchain. Covers the
; feetech wire protocol (checksums, frame builders, response parsing, sign-
; magnitude packing) and the safety FSM (E-stop latch, battery debounce,
; overload trip, clear-refusal). test/mock_arduino/ shims <Arduino.h> so the
; device headers compile unchanged. test_build_src stays off (default) — the
; headers are header-only, so no device .cpp is pulled in.
;   Run:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -I test/mock_arduino
    -I src
