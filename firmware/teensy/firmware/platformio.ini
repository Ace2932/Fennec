; PlatformIO project — Nova-SM3 LE Teensy 4.1 firmware
; Pattern B bus master per BOM v3.3:
;   Jetson micro-ROS over USB → Teensy → 74HC125 → Feetech STS3215 TTL bus
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; NOTE — 2026-05-19: micro-ROS lib_dep removed until we move firmware
; builds to the Jetson (Mac builds of micro_ros_platformio break on
; Python 3.14 + missing ROS dev libs). This skeleton is Arduino-only
; for now. Reinstate the lib_dep line below + uncomment micro-ROS
; includes in src/main.cpp once building on the Jetson.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D NOVA_TEENSY_FIRMWARE
    -D NOVA_BUS_BAUD=1000000
    -D NOVA_LOOP_HZ=200
;   -D NOVA_USE_MICRO_ROS
; lib_deps =
;     https://github.com/micro-ROS/micro_ros_platformio.git
monitor_speed = 115200
upload_protocol = teensy-cli
