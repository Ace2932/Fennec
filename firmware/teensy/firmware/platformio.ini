; PlatformIO project — Nova-SM3 LE Teensy 4.1 firmware
; Pattern B bus master per BOM v3.3:
;   Jetson micro-ROS over USB → Teensy → 74HC125 → Feetech STS3215 TTL bus
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; NOTE — 2026-05-19: builds moved to Jetson (Python 3.10 OK).
; Mac path remains Arduino-only (micro_ros_platformio breaks on Py3.14).
; To build on Mac, comment out NOVA_USE_MICRO_ROS flag + lib_deps below.

; Shared defaults: build flags + libs that don't need ROS dev tooling.
[env]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D NOVA_TEENSY_FIRMWARE
    -D NOVA_BUS_BAUD=1000000
    -D NOVA_LOOP_HZ=200
    ; 4th INA226 on the L2 LiDAR 12V rail (0x45). Adds rail_l2 to the round-robin
    ; + publishes it at /power_rails[9..11] (12-float layout). LiDAR is nav-critical
    ; + brownout-sensitive, so it gets the 4th module (arm rail deferred — DNP).
    -D NOVA_INA226_L2
    ; Build provenance — git SHA captured at compile time, exposed via
    ; /firmware_version. Falls back to "unknown" outside a git checkout.
    !echo '-D NOVA_BUILD_GIT_SHA=\"'$(git rev-parse --short HEAD 2>/dev/null || echo unknown)'\"'
monitor_speed = 115200
upload_protocol = teensy-cli
lib_deps =
    robtillaart/INA226@^0.6.4

; Default env — used on the Jetson, includes micro-ROS.
[env:teensy41]
build_flags =
    ${env.build_flags}
    -D NOVA_USE_MICRO_ROS
lib_deps =
    ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio.git

; CI env — Arduino-only, no micro-ROS lib pull. Used by .github/workflows so
; PR checks finish in ~3 min without the ROS dev-libs install. Exercises every
; non-micro-ROS code path (feetech protocol/bus, INA226, ISR tick, histograms).
[env:teensy41_ci]
build_flags = ${env.build_flags}
lib_deps    = ${env.lib_deps}
